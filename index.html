<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFix AI APK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

    #sidebar {
      width: 280px; background-color: #111827; border-left: 1px solid #1f2937;
      display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100;
    }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #1f2937; display: flex; gap: 10px; }
    .new-chat-btn {
      flex: 1; padding: 10px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
    .chat-item {
      padding: 12px; margin-bottom: 8px; background: #1f2937; border-radius: 8px;
      cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item.active { border-right: 4px solid #2563eb; background: #374151; }

    .main-container { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

    header {
      height: 60px; background: #111827; border-bottom: 1px solid #1f2937;
      display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
    }
    .toggle-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .app-title { color: #3b82f6; font-weight: bold; font-size: 18px; }
    .plan-badge {
      border: 1px solid #f59e0b; padding: 5px 12px; border-radius: 8px;
      font-size: 12px; text-align: center; cursor: pointer; background: rgba(245, 158, 11, 0.1);
    }
    .plan-badge span { display: block; color: #f59e0b; font-weight: bold; }
    .plan-badge small { color: #9ca3af; font-size: 10px; }

    .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .hero-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px;
      text-align: center; margin: auto; max-width: 400px;
    }
    .hero-card h2 { color: #3b82f6; margin-bottom: 10px; }
    .hero-card p { color: #9ca3af; font-size: 14px; }

    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
    .message.user { background: #2563eb; color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
    .message.bot { background: #1f2937; color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; }

    .input-area { padding: 15px; background: #111827; border-top: 1px solid #1f2937; }
    .preview-box { display: none; margin-bottom: 10px; position: relative; width: 60px; height: 60px; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .preview-box .remove-img {
      position: absolute; top: -5px; right: -5px; background: red; color: white;
      border-radius: 50%; width: 18px; height: 18px; text-align: center; font-size: 12px; cursor: pointer;
    }
    .input-box { display: flex; gap: 10px; background: #1f2937; padding: 8px; border-radius: 10px; align-items: center; }
    .input-box input[type="text"] { flex: 1; background: none; border: none; color: white; outline: none; padding: 5px; }
    .attach-btn { cursor: pointer; font-size: 20px; padding: 0 5px; color: #9ca3af; }
    .send-btn { background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: #0f172a; width: 90%; max-width: 500px; max-height: 85vh; border-radius: 12px; padding: 20px; overflow-y: auto; border: 1px solid #1f2937; }
    .modal-header { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f59e0b; }
    .plans-list { display: flex; flex-direction: column; gap: 12px; }
    .plan-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .plan-info { display: flex; justify-content: space-between; align-items: center; }
    .plan-name { font-weight: bold; font-size: 14px; }
    .plan-badges { display: flex; gap: 5px; }
    .badge-ads { background: #d97706; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .badge-time { background: #059669; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .watch-ad-btn { background: #2563eb; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; text-align: center; }
    .close-modal { margin-top: 15px; width: 100%; padding: 10px; background: #374151; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="createNewChat()">+ محادثة جديدة</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="main-container">
    <header>
      <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
      <div class="app-title">OmniFix AI</div>
      <div class="plan-badge" onclick="openPlansModal()">
        <span id="currentPlanName">الباقة العادية</span>
        <small id="currentPlanStatus">غير مفعلة</small>
      </div>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="hero-card" id="heroCard">
        <h2>OmniFix AI</h2>
        <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="preview-box" id="previewBox">
        <img id="previewImg" src="">
        <div class="remove-img" onclick="removeImage()">×</div>
      </div>
      <div class="input-box">
        <label for="imageInput" class="attach-btn">📷</label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <div class="modal" id="plansModal">
    <div class="modal-content">
      <div class="modal-header">اختر الباقة المناسبة 👑</div>
      <div class="plans-list" id="plansList"></div>
      <button class="close-modal" onclick="closePlansModal()">إغلاق</button>
    </div>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem('omni_chats')) || [];
    let currentChatId = null;
    let selectedImageBase64 = null;
    let activePlan = JSON.parse(localStorage.getItem('omni_plan')) || { name: 'الباقة العادية', active: false };

    const plansData = [
      "الباقة الأساسية", "Unity 2D", "Unity 3D", "C# Advanced", "Web HTML/CSS",
      "Node.js Server", "Express APIs", "Python Code", "كتابة المقالات", "التعبير الإبداعي",
      "تحليل الصور", "الهندسة العكسية", "تصميم الألعاب", "UI/UX Mobile", "قاعدة البيانات",
      "الذكاء الاصطناعي", "معالجة اللغات", "أمن المعلومات", "السكريبتات", "التسويق الرقمي",
      "الترجمة الفوربة", "مراجعة الكود", "تحسين الأداء", "الدعم الفني", "حل الخوارزميات",
      "OmniFix Pro", "OmniFix Max", "OmniFix Ultra", "باقة الذكاء الخارق", "باقة VIP"
    ];

    function init() {
      renderChatList();
      renderPlans();
      updatePlanUI();
      if (chats.length === 0) createNewChat();
      else selectChat(chats[0].id);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
    }

    function createNewChat() {
      const newChat = { id: Date.now(), title: 'محادثة جديدة', messages: [] };
      chats.unshift(newChat);
      saveChats();
      renderChatList();
      selectChat(newChat.id);
    }

    function selectChat(id) {
      currentChatId = id;
      renderChatList();
      renderMessages();
    }

    function saveChats() { localStorage.setItem('omni_chats', JSON.stringify(chats)); }

    function renderChatList() {
      const chatList = document.getElementById('chatList');
      chatList.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.innerText = chat.title;
        item.onclick = () => selectChat(chat.id);
        chatList.appendChild(item);
      });
    }

    function renderMessages() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      const currentChat = chats.find(c => c.id === currentChatId);

      if (!currentChat || currentChat.messages.length === 0) {
        chatBox.innerHTML = `
          <div class="hero-card">
            <h2>OmniFix AI</h2>
            <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
          </div>`;
        return;
      }

      currentChat.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.sender}`;
        msgDiv.innerText = msg.text;
        if (msg.image) {
          const img = document.createElement('img');
          img.src = msg.image;
          msgDiv.appendChild(img);
        }
        chatBox.appendChild(msgDiv);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        selectedImageBase64 = evt.target.result;
        document.getElementById('previewImg').src = selectedImageBase64;
        document.getElementById('previewBox').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      selectedImageBase64 = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('previewBox').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && !selectedImageBase64) return;

      const currentChat = chats.find(c => c.id === currentChatId);
      if (currentChat.messages.length === 0 && text) {
        currentChat.title = text.substring(0, 20);
        renderChatList();
      }

      const userMsg = { sender: 'user', text: text, image: selectedImageBase64 };
      currentChat.messages.push(userMsg);
      renderMessages();

      input.value = '';
      const imageToSend = selectedImageBase64;
      removeImage();

      const botMsg = { sender: 'bot', text: 'جاري التفكير...' };
      currentChat.messages.push(botMsg);
      renderMessages();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, image: imageToSend, plan: activePlan.name })
        });
        const data = await response.json();
        botMsg.text = data.reply || 'حدث خطأ أثناء جلب الرد.';
      } catch (err) {
        botMsg.text = 'تعذر الاتصال بالسيرفر.';
      }

      saveChats();
      renderMessages();
    }

    function openPlansModal() { document.getElementById('plansModal').style.display = 'flex'; }
    function closePlansModal() { document.getElementById('plansModal').style.display = 'none'; }

    function renderPlans() {
      const list = document.getElementById('plansList');
      list.innerHTML = '';
      plansData.forEach((name, index) => {
        const adsCount = index + 1;
        const card = document.createElement('div');
        card.className = 'plan-card';
        card.innerHTML = `
          <div class="plan-info">
            <span class="plan-name">باقة ${adsCount}: ${name}</span>
            <div class="plan-badges">
              <span class="badge-time">⏱️ 12 ساعة</span>
              <span class="badge-ads">🎬 ${adsCount} إعلان</span>
            </div>
          </div>
          <button class="watch-ad-btn" onclick="activatePlan('${name}', ${adsCount})">مشاهدة الإعلان (0/${adsCount})</button>
        `;
        list.appendChild(card);
      });
    }

    function activatePlan(name, ads) {
      alert(`سيتم فتح الإعلان (${ads}). عند اكتماله ستتفعل ${name} لمدة 12 ساعة!`);
      activePlan = { name: name, active: true };
      localStorage.setItem('omni_plan', JSON.stringify(activePlan));
      updatePlanUI();
      closePlansModal();
    }

    function updatePlanUI() {
      document.getElementById('currentPlanName').innerText = activePlan.name;
      document.getElementById('currentPlanStatus').innerText = activePlan.active ? 'مفعلة ✅' : 'غير مفعلة';
    }

    init();
  </script>
</body>
        </html>
